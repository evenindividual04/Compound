name: nightly-db-backup

on:
  schedule:
    - cron: "0 22 * * *" # 03:30 IST
  workflow_dispatch: {}

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client age rclone

      - name: Dump, encrypt, upload
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }} # direct (non-pooled) Neon string
          AGE_PUBLIC_KEY: ${{ secrets.AGE_PUBLIC_KEY }}
          RCLONE_CONFIG_R2_TYPE: s3
          RCLONE_CONFIG_R2_PROVIDER: Cloudflare
          RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
        run: |
          set -euo pipefail
          STAMP=$(date -u +%Y-%m-%d)
          pg_dump "$DATABASE_URL" -Fc -f "fin-$STAMP.dump"
          age -r "$AGE_PUBLIC_KEY" -o "fin-$STAMP.dump.age" "fin-$STAMP.dump"
          rclone copy "fin-$STAMP.dump.age" "R2:${{ secrets.R2_BUCKET }}/backups/"
          # prune backups older than 30 days
          rclone delete "R2:${{ secrets.R2_BUCKET }}/backups/" --min-age 30d
          echo "backup fin-$STAMP.dump.age uploaded"
